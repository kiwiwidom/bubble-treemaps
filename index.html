<!DOCTYPE html>
<html lang="en" style="width:100%;height:100%;margin:0;padding:0;">
<head>
    <meta charset="UTF-8">
    <title>Bubble Treemaps - Styled</title>
    <script type='text/javascript' src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type='text/javascript' src="https://d3js.org/d3.v4.js"></script>
    <script type='text/javascript' src="https://cdn.jsdelivr.net/planck/0.1/planck.js"></script>
    <script type='text/javascript' src="https://cdn.jsdelivr.net/gh/grtlr/bubble-treemaps@master/build/d3-bubbletreemap.js"></script>
    <script>
        let working = false;

        function sortChildrenByName(node) {
            if (node.children) {
                node.children.sort((a, b) => a.name.localeCompare(b.name));
                node.children.forEach(sortChildrenByName);
            }
        }

        function doIt() {
            if (!working) {
                working = true;

                let jsonData = undefined;
                try {
                    jsonData = JSON.parse(document.getElementById("jsonInputField").value);
                } catch (e) {}

                if (jsonData) {
                    sortChildrenByName(jsonData);

                    let svg = d3.select("#svgCircles");
                    svg.selectAll("*").remove();

                    let padding = Number(document.getElementById("paddingSlider").value);
                    let curvature = Number(document.getElementById("curvatureSlider").value);
                    let uncertaintySliderValue = Number(document.getElementById("uncertaintySlider").value);

                    drawChart(jsonData, svg, padding, (curvature === 100 ? 100000 : curvature), uncertaintySliderValue);
                }

                working = false;
            }
        }
        function drawChart(data, svg, padding, curvature, uncertaintySliderValue) {
            
            // NEW: This function maps an "uncertainty" value to a specific color.
            function getColorByCrowding(uncertainty) {
                if (uncertainty >= 7) {
                    return "#BB2530"; // Congested (Red)
                } else if (uncertainty >= 5) {
                    return "#DA8F34"; // Moderately Crowded (Orange)
                } else if (uncertainty >= 2) {
                    return "#EED859"; // Lightly Crowded (Yellow)
                } else {
                    return "#64AD53"; // Spacious (Green)
                }
            }
            

            // Create hierarchy.
            let root = d3.hierarchy(data)
                .sum(function(d) {
                    return d.size || 0;
                })
                .sort(function(a, b) {
                    return b.value - a.value;
                });

            let renderedSVGSize = svg.node().getBoundingClientRect();

            // Create bubbletreemap.
            let bubbletreemap = d3.bubbletreemap()
                .padding(padding)
                .curvature(curvature)
                .hierarchyRoot(root)
                .width(renderedSVGSize.width)
                .height(renderedSVGSize.height);

            let hierarchyRoot = bubbletreemap.doLayout().hierarchyRoot();

            let leafNodes = hierarchyRoot.descendants().filter(function(candidate) {
                return !candidate.children;
            });
             
            let parentNodes = hierarchyRoot.descendants().filter(function(candidate) {
                 return candidate.children && candidate.depth > 0;
            });

// Draw contour (smooth adaptive dashes based on uncertainty)
let contourGroup = svg.append("g")
    .attr("class", "contour");

contourGroup.selectAll("path")
  .data(bubbletreemap.getContour())
  .enter().append("path")
  .attr("d", d => d.d)
  .style("fill", "none")
  .style("stroke", "#999")
  .style("stroke-width", "2.5px")
  .each(function(d) {
    const totalLength = this.getTotalLength();
    const u = uncertaintySliderValue / 10; // normalize (0–10 → 0–1)

    // --- Smoothly interpolate dash & gap lengths ---
    // As uncertainty ↑ → dash shorter, gap wider
    const dashLength = 20 - (u * 10); // 20 → 10
    const gapLength  = 8 + (u * 18);  // 8 → 26

    // --- Evenly space pattern so it wraps nicely around edges ---
    const patternLength = dashLength + gapLength;
    const dashCount = patternLength > 0 ? Math.round(totalLength / patternLength) : 0;
    const adjustedDash = dashCount > 0 ? totalLength / (dashCount * 2) : 0;
    const adjustedGap  = adjustedDash * (gapLength / dashLength);

    d3.select(this)
      .style("stroke-dasharray",
             u < 0.1 ? "none" : `${adjustedDash},${adjustedGap}`)
      .style("stroke-dashoffset", 0);
  })
  .style("opacity", 1)
  .attr("transform", d => d.transform);

            // Draw circles.
            let circleGroup = svg.append("g")
                .attr("class", "circlesAfterPlanck");

            circleGroup.selectAll("circle")
                .data(leafNodes)
                .enter().append("circle")
                .attr("r", function(d) { return d.r; })
                .attr("cx", function(d) { return d.x; })
                .attr("cy", function(d) { return d.y; })
                // MODIFICATION: Fill and stroke color are now set by our new function.
                .style("fill", function(d) { 
                    // Use the uncertainty value from the original data (d.data).
                    return getColorByCrowding(d.data.uncertainty); 
                })
                .style("stroke", function(d) { 
                    const color = getColorByCrowding(d.data.uncertainty);
                    return d3.rgb(color).darker(0.8); 
                })
                .style("stroke-width", "2px");

            // Add labels for parent nodes (no changes here).
            let labelGroup = svg.append("g")
                 .attr("class", "labels");

    // let labels = labelGroup.selectAll("g")
    //     .data(leafNodes.filter(d => d.data.name)) // Only nodes with a non-empty name
    //     .enter().append("g")
    //     .attr("transform", function(d) {
    //         return "translate(" + d.x + "," + d.y + ")";
    //     });

    //         labels.append("text")
    //             .attr("dy", "0.3em")
    //             .style("text-anchor", "middle")
    //             .style("font-family", "Arial, sans-serif")
    //             .style("font-size", "14px")
    //             .style("fill", "#333")
    //             .text(function(d) { return d.data.name; });
            
    //         labels.each(function() {
    //             let textNode = d3.select(this).select("text");
    //             let bbox = textNode.node().getBBox();
    //             let padding = 5;
                
    //             d3.select(this).insert("rect", "text")
    //                 .attr("x", bbox.x - padding)
    //                 .attr("y", bbox.y - padding)
    //                 .attr("width", bbox.width + (padding * 2))
    //                 .attr("height", bbox.height + (padding * 2))
    //                 .style("fill", "white")
    //                 .style("opacity", 0.75)
    //                 .attr("rx", 8) 
    //                 .attr("ry", 8);
    //         });
        }
    </script>
</head>
<body onload="doIt()" style="width:100%;height:99%;margin:0;padding:0; font-family: Arial, sans-serif;">
    <div id="svgCirclesContainer" style="float:left; width: 50%; height: 100%;">
        <svg id="svgCircles" width="100%" height="100%"></svg>
    </div>

    <div style="position: absolute; left:20px; bottom:40px;" id="paddingSliderContainer">
        Padding: <input style="position: absolute; left:100px; vertical-align: middle;" type="range" min="0" max="100" value="10" class="slider" id="paddingSlider" oninput="document.getElementById('paddingValue').innerText = this.value; doIt();">
        <span id="paddingValue" style="position: absolute; left: 240px; vertical-align: middle;">10</span>
    </div>
    <div style="position: absolute; left:20px; bottom:80px;" id="curvatureSliderContainer">
        Smoothness: <input style="position: absolute; left:100px; vertical-align: middle;" type="range" min="1" max="100" value="10" class="slider" id="curvatureSlider" oninput="document.getElementById('curvatureValue').innerText = this.value; doIt();">
        <span id="curvatureValue" style="position: absolute; left: 240px; vertical-align: middle;">10</span>
    </div>
    <!-- Add this slider below the existing ones -->
    <div style="position: absolute; left:20px; bottom:120px;" id="uncertaintySliderContainer">
        Uncertainty: <input style="position: absolute; left:100px; vertical-align: middle;" type="range" min="0" max="10" value="7" class="slider" id="uncertaintySlider" oninput="document.getElementById('uncertaintyValue').innerText = this.value; doIt();">
        <span id="uncertaintyValue" style="position: absolute; left: 240px; vertical-align: middle;">7</span>
    </div>

    <div id="jsonInputFieldContainer" style="float:right; width: 50%; height: 100%;">
        <textarea id="jsonInputField" type="text" style="float:right; width: 100%; height: 100%; box-sizing: border-box;" oninput="doIt()">
{
  "name": "Vito Cruz Station",
  "uncertainty": 7,
  "children": [
    {
      "name": "Train",
      "uncertainty": 10,
       "children": [
         {
            "name": "P", "size": 50, "uncertainty": 10
         },
         {
            "name": "W", "size": 25, "uncertainty": 1
         },
         {
            "name": "G", "size": 40, "uncertainty": 5
         }
      ]
    },
    {
      "name": "Platform",
      "uncertainty": 5,
      "children": [
        { "name": "P", "size": 30, "uncertainty": 5 },
        { "name": "", "size": 0.0001, "uncertainty": 2 }
  ]
    },
    {
      "name": "Queue",
      "uncertainty": 5,
      "children": [
        {
          "name": "E",
          "size": 30,
          "uncertainty": 3
        },
        {
          "name": "TB",
          "size": 25,
          "uncertainty": 1
        }
      ]
    }
  ]
}
        </textarea>
    </div>
</body>
</html>
